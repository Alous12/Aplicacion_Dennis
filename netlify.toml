# Un solo sitio de Netlify sirve el frontend (Angular) y el backend (Netlify Functions).
[build]
  base = "."
  command = "npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist/frontend/browser"
  functions = "backend/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # El escáner de secretos de Netlify confunde datos PÚBLICOS de Firebase con secretos:
  # - FIREBASE_PROJECT_ID: el ID del proyecto también aparece en el frontend (no es secreto).
  # - La apiKey web de Firebase (AIza...): siempre va en el frontend; la seguridad la dan el
  #   backend y las reglas de Firestore (que bloquean todo acceso directo).
  # Los secretos reales (JWT_SECRET, FIREBASE_PRIVATE_KEY, FIREBASE_CLIENT_EMAIL) se siguen escaneando.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDNTpV1KfByuFC5ET5MKIde6Ub1sVdtxv8"

[functions]
  node_bundler = "esbuild"
  # firebase-admin se incluye como dependencia normal (no se empaqueta con esbuild)
  external_node_modules = ["firebase-admin"]

# La API Express vive en una sola función: /api/* -> /.netlify/functions/api/*
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA: cualquier otra ruta la resuelve Angular
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Necesario para que el popup de Google (Firebase Auth) pueda comunicarse con la página
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
